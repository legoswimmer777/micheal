<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>Six Seven</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Poppins", sans-serif;
        min-height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;

        /* Mango Sunset Gradient */
        background: linear-gradient(
          135deg,
          #ffb703,
          #fb8500,
          #ff7b00,
          #ff5400,
          #ffd60a
        );

        background-size: 400% 400%;
        animation: mangoFlow 12s ease infinite;
      }

      @keyframes mangoFlow {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      /* Floating Mango Glow Shapes */
      .bg-shape {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.4;
        z-index: 1;
      }

      .shape1 {
        width: 320px;
        height: 320px;
        background: #ffe066;
        top: -100px;
        left: -100px;
      }

      .shape2 {
        width: 380px;
        height: 380px;
        background: #ff8500;
        bottom: -120px;
        right: -120px;
      }

      .shape3 {
        width: 250px;
        height: 250px;
        background: #ffea00;
        top: 45%;
        left: 60%;
      }

      /* Hero Content */
      .hero {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 50px;
        border-radius: 30px;

        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.15);

        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.2),
          inset 0 0 20px rgba(255, 255, 255, 0.05);
      }

      .hero h1 {
        font-size: 6rem;
        font-weight: 700;
        letter-spacing: 8px;
        text-transform: uppercase;

        background: linear-gradient(
          90deg,
          #fff8dc,
          #fff176,
          #ffd54f,
          #ffec99
        );

        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;

        animation: glow 3s ease-in-out infinite alternate;
      }

      .hero p {
        margin-top: 18px;
        font-size: 1.2rem;
        letter-spacing: 3px;
        color: rgba(255, 255, 255, 0.9);
      }

      @keyframes glow {
        from {
          text-shadow: 0 0 20px rgba(255, 200, 0, 0.4);
        }

        to {
          text-shadow: 0 0 40px rgba(255, 140, 0, 0.9);
        }
      }

      /* Mango Loader */
      .loading-screen {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(255, 140, 0, 0.2);
        backdrop-filter: blur(12px);
        z-index: 9999;

        animation: fadeOut 1s ease forwards;
        animation-delay: 1.5s;
      }

      .loader {
        width: 75px;
        height: 75px;
        border: 6px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff176;
        border-radius: 50%;

        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes fadeOut {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }

      @media (max-width: 768px) {
        .hero {
          width: 90%;
          padding: 35px 20px;
        }

        .hero h1 {
          font-size: 3rem;
          letter-spacing: 4px;
        }

        .hero p {
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- Mango Glow Background -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>
    <div class="bg-shape shape3"></div>

    <!-- Mango Loader -->
    <div class="loading-screen">
      <div class="loader"></div>
    </div>

    <!-- Main Content -->
    <div class="hero">
      <h1>Six Seven</h1>
      <p>Sweet • Vibrant • Mango Energy</p>
    </div>

    <!-- React App -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
